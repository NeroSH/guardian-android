name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# One run per PR. Pushing a new commit cancels the in-flight run for that PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # This exact string is the required status check in the `main` ruleset.
    # Renaming it silently un-gates main — update the ruleset in the same commit.
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `secrets` is not a valid context in a step-level `if:`, so it is mirrored into env here.
    # Both are unset today; see the ":app" step below.
    env:
      G_SRV: ${{ secrets.G_SRV }}
      K_ZILLA: ${{ secrets.K_ZILLA }}

    # Every action below is GitHub-owned and pinned to a full-length commit SHA, because this
    # repo's Actions policy allows only GitHub-authored actions and rejects tag refs.
    # gradle/actions/setup-gradle would be the better Gradle cache, but Gradle is a third-party
    # owner and is blocked by that policy — see the cache step for the replacement.
    steps:
      # actions/checkout — official GitHub action (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-java — official GitHub action (v5.6.0).
      # JDK 21 = the Studio JBR this project is built with locally. The modules target
      # bytecode 17 (`compileOptions`), which a 21 toolchain emits fine.
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      # actions/cache — official GitHub action (v6.1.0).
      # Caches the dependency cache and Gradle's local build cache (gradle.properties sets
      # org.gradle.caching=true). Key busts whenever a build script or the version catalog moves.
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # compileSdk from gradle/libs.versions.toml. Runner images lag new platforms, and
      # relying on AGP's implicit SDK download is the flakiest part of an Android CI run.
      # Bump this when compileSdk is bumped.
      - name: Install compileSdk platform
        run: |
          SDK=$(grep -E '^compileSdk *=' gradle/libs.versions.toml | cut -d '"' -f2)                                                                                    
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"               
          "$SDKMANAGER" "platforms;android-${SDK}.0" || "$SDKMANAGER" "platforms;android-${SDK}"

      # local.properties is gitignored, but app/build.gradle.kts reads signing values from it
      # at *configuration* time — without this, every Gradle task fails before it starts,
      # including tests in unrelated modules. Values are throwaway: nothing here is signed,
      # and baseUrl only lands in a BuildConfig field that no unit test reads.
      - name: Write stub local.properties
        run: |
          cat > local.properties <<'EOF'
          keyAlias=ci
          keyPassword=ci
          storeFile=ci-unused.jks
          storePassword=ci
          baseUrl=http://localhost:8080
          EOF

      # :core:policy:test is the real suite (PolicyEvaluatorTest). The library testDebugUnitTest
      # tasks have no test sources, but reaching them compiles every module against its
      # dependencies — that cross-module compile is the point.
      # :app and :macrobenchmark are absent on purpose: :app needs google-services.json +
      # kotzilla.json (see below), :macrobenchmark needs an emulator.
      # --no-daemon: without setup-gradle managing daemon shutdown, a live daemon can leave lock
      # files in ~/.gradle/caches at the moment actions/cache saves it.
      - name: Run unit tests
        run: |
          ./gradlew --no-daemon \
            :core:policy:test \
            :core:navigation:testDebugUnitTest \
            :data:testDebugUnitTest \
            :feature:child:api:testDebugUnitTest \
            :feature:child:impl:testDebugUnitTest \
            :feature:parent:api:testDebugUnitTest \
            :feature:parent:impl:testDebugUnitTest

      # Skipped until both secrets exist. To turn on :app compile coverage, add repo secrets
      # G_SRV and K_ZILLA (base64 of each file) — no edit needed here.
      - name: Build :app
        if: env.G_SRV != '' && env.K_ZILLA != ''
        run: |
          echo "$G_SRV" | base64 -d > app/google-services.json
          echo "$K_ZILLA" | base64 -d > app/kotzilla.json
          ./gradlew --no-daemon :app:assembleDebug

      # actions/upload-artifact — official GitHub action (v7.0.1).
      # always() so a failed run still yields the HTML report that explains the failure.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: warn
